services:
  frontend:
    build:
      context: ./frontend
      target: production
      args:
        VITE_APP_SERVER_URL: ${VITE_APP_SERVER_URL}
        VITE_BASE_APP_URL: ${VITE_BASE_APP_URL}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    container_name: frontend
    restart: always
    ports:
      - "5173:5173"
    security_opt:
      - no-new-privileges=true
    read_only: true
    tmpfs:
      - /tmp:mode=1777
      - /var/cache/nginx:uid=101,gid=101,mode=755
      - /var/run:uid=101,gid=101,mode=755
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      target: production
    container_name: backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    security_opt:
      - no-new-privileges=true
    read_only: true
    tmpfs:
      - /tmp
